[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-host-manager-mcp"
version = "0.1.10"
description = "Cross-platform FastMCP server for authenticated remote Linux/macOS host administration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Ahmet Baktiaya", email = "ahmet.baktiaya@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "chatgpt",
    "remote-shell",
    "devops",
    "sysadmin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp>=2.13,<5",
    "python-dotenv>=1.0,<2",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Abktya/universal-host-manager-mcp"
Repository = "https://github.com/Abktya/universal-host-manager-mcp"
Issues = "https://github.com/Abktya/universal-host-manager-mcp/issues"
Security = "https://github.com/Abktya/universal-host-manager-mcp/blob/main/SECURITY.md"

[project.scripts]
universal-host-manager-mcp = "universal_host_manager_mcp:main"
uhm-setup = "universal_host_manager_mcp.setup_wizard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_host_manager_mcp"]
